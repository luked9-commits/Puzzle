async function sha(text){

    const enc = new TextEncoder();

    const buf = await crypto.subtle.digest(
        "SHA-256",
        enc.encode(text)
    );

    return Array.from(new Uint8Array(buf))
        .map(x => x.toString(16).padStart(2,"0"))
        .join("");

}
